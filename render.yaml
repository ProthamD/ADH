services:
  - type: web
    name: alexa-delegation-broker
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/seed_demo.py --reset
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_PROXY_DEMO
        value: "true"
      - key: ALLOW_DIRECT_FALLBACK
        value: "true"
      - key: USE_SEMANTIC_CLASSIFIER
        value: "true"
      - key: ENCRYPTION_KEY
        value: "leEK-BwIZD-BoNeYgWcKg6Du-BwCIc5vebIDNYrHXHU="
      - key: HMAC_SECRET
        value: "8eff666b3a848bd842fb2abafe43a427ac08830c8e0881f2b133f9bc40722626"
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: MAX_FACTS_PER_ANSWER
        value: "2"
      - key: ESCALATION_WEBHOOK_URL
        value: "https://httpbin.org/post"
