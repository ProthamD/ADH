services:
  - type: web
    name: alexa-delegation-broker
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/seed_demo.py --reset
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: BEDROCK_MODEL_ID
        value: "amazon.nova-micro-v1:0"
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: MAX_FACTS_PER_ANSWER
        value: "2"
      - key: ESCALATION_WEBHOOK_URL
        value: "https://httpbin.org/post"
